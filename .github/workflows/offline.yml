name: Offline patch checks
# Branch pushes other than main run through their pull request, so each change
# is checked once. Tags are excluded on purpose: release.yml verifies a tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  offline:
    name: offline (${{ matrix.os }}, ${{ matrix.python }})
    timeout-minutes: 10
    # The pre-release interpreter is an early signal only. It becomes a
    # blocking matrix entry once its final release is published.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        experimental: [false]
        include:
          - os: ubuntu-latest
            python: '3.15'
            experimental: true
          - os: windows-latest
            python: '3.15'
            experimental: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python tests/run_offline.py

  pinned-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Verify pinned public source before lifecycle checks
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.error
          import urllib.request
          sys.path.insert(0, "tests")
          from validate_upstream import HASHES, PIN
          paths = {"base.py": "gateway/platforms/base.py", "run.py": "gateway/run.py"}
          with tempfile.TemporaryDirectory() as directory:
              for name, source in paths.items():
                  url = f"https://api.github.com/repos/NousResearch/hermes-agent/contents/{source}?ref={PIN}"
                  request = urllib.request.Request(url, headers={"Accept": "application/vnd.github.raw+json"})
                  for attempt in range(3):
                      try:
                          with urllib.request.urlopen(request, timeout=20) as response:
                              raw = response.read(5_000_001)
                          break
                      except urllib.error.HTTPError as error:
                          if error.code != 429 or attempt == 2:
                              raise
                          try:
                              delay = int((error.headers or {}).get("Retry-After", ""))
                          except ValueError:
                              delay = 5 * (attempt + 1)
                          time.sleep(min(10, max(1, delay)))
                  if len(raw) > 5_000_000 or hashlib.sha256(raw).hexdigest() != HASHES[name]:
                      raise SystemExit(f"Pinned source hash mismatch: {name}")
                  (Path(directory) / name).write_bytes(raw)
              subprocess.run([sys.executable, "tests/validate_upstream.py", directory], check=True, timeout=90)
          PY
