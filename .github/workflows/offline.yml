name: Offline patch checks
# Branch pushes other than main run through their pull request, so each change
# is checked once. Tags are excluded on purpose: release.yml verifies a tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  offline:
    name: offline (${{ matrix.os }}, ${{ matrix.python }})
    timeout-minutes: 10
    # The pre-release interpreter is an early signal only. It becomes a
    # blocking matrix entry once its final release is published.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        experimental: [false]
        include:
          - os: ubuntu-latest
            python: '3.15'
            experimental: true
          - os: windows-latest
            python: '3.15'
            experimental: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python tests/run_offline.py

  pinned-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Verify pinned public source before lifecycle checks
        shell: bash
        # tests/fetch_pinned_source.py verifies every hash before it writes
        # or runs anything. No token: this job executes the verified code.
        run: python tests/fetch_pinned_source.py "$RUNNER_TEMP/upstream-fixture" --validate
